name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            ext: .exe
          - os: ubuntu-latest
            name: linux-x86_64
            ext: ""
          - os: macos-latest
            name: macos-aarch64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Rename binary with platform suffix
        run: cp target/release/run-cli${{ matrix.ext }} target/release/run-cli-${{ matrix.name }}${{ matrix.ext }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-cli-${{ matrix.name }}
          path: target/release/run-cli-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check on MSRV
        run: cargo check --all-targets
      - name: Test on MSRV
        run: cargo test