name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            ext: .exe
          - os: ubuntu-latest
            name: linux-x86_64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Rename binary with platform suffix
        run: cp target/release/run-cli${{ matrix.ext }} target/release/run-cli-${{ matrix.name }}${{ matrix.ext }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-cli-${{ matrix.name }}
          path: target/release/run-cli-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: run-cli-*
          merge-multiple: false
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            run-cli-windows-x86_64/run-cli-windows-x86_64.exe
            run-cli-linux-x86_64/run-cli-linux-x86_64
          fail_on_unmatched_files: false